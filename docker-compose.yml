services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    ports:
      - "3000:3000"

  control-marketing:
    build:
      context: .
      dockerfile: control-marketing/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  lading-page:
    build:
      context: .
      dockerfile: lading-page/Dockerfile
    depends_on:
      - backend
    ports:
      - "8081:80"
